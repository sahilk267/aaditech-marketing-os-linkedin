name: Aadi Marketing OS - Application CI
on:
  push:
    paths: ['app/**','bootstrap/**','config/**','database/**','routes/**','resources/**','tests/**','worker/**','scripts/**','artisan','composer.json','phpunit.xml','phpunit.database.xml','.github/workflows/app-ci.yml']
  pull_request:
  workflow_dispatch:
jobs:
  php-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, curl, pdo_sqlite, sqlite3, pdo_mysql, fileinfo, openssl
          tools: composer:v2
          coverage: none
      - name: Validate composer manifest
        run: composer validate --no-check-publish
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax-check PHP
        run: find app bootstrap config database routes tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Execute Laravel feature tests
        run: php artisan test
      - name: Check routes
        run: php artisan route:list
  database-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:11.4']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: aadi_ci
          MARIADB_DATABASE: aadi_ci
          MYSQL_USER: aadi_ci_user
          MARIADB_USER: aadi_ci_user
          MYSQL_PASSWORD: ci-only-disposable-password
          MARIADB_PASSWORD: ci-only-disposable-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ startsWith(matrix.database, 'mariadb') && 'healthcheck.sh --connect --innodb_initialized' || 'mysqladmin ping -h localhost --silent' }}"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, pdo_mysql, fileinfo, openssl
          tools: composer:v2
          coverage: none
      - name: Install application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Execute full Laravel suite on actual database service
        run: php artisan test --configuration=phpunit.database.xml
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Run worker unit tests
        working-directory: worker
        run: python -m unittest discover -s tests -v
