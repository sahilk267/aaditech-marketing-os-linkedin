name: Aadi Marketing OS - Build Deployment Bundle
on:
  push:
    branches: ['main']
    paths: ['app/**','bootstrap/**','config/**','database/**','routes/**','resources/**','worker/**','scripts/**','artisan','composer.json','.github/workflows/build-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: aadi_ci
          MARIADB_USER: aadi_ci_user
          MARIADB_PASSWORD: ci-only-disposable-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, pdo_mysql, pdo_sqlite, sqlite3, fileinfo, openssl
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate composer manifest
        run: composer validate --no-check-publish
      - name: Resolve and install dependencies for this artifact
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run Laravel migrations, feature tests and route registration
        run: |
          php artisan test
          php artisan test --configuration=phpunit.database.xml
          php artisan route:list
      - name: Run Python worker security and integration tests
        working-directory: worker
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Run canonical source and tracker checks
        run: |
          python scripts/check_source.py
          python docs/implementation/validate_tracker.py
      - name: Prepare tested production dependencies
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          test -s composer.lock
          php artisan route:list

      - name: Build archive without credentials
        shell: bash
        run: |
          mkdir -p dist
          tar --exclude='.env' --exclude='.git' --exclude='node_modules' \
              --exclude='tests' --exclude='dist' --exclude='phase0' \
              --exclude='phase1' --exclude='phase2plus' --exclude='*.log' \
              -czf dist/aadi-marketing-os-release.tar.gz \
              artisan composer.json composer.lock app bootstrap config database routes resources public worker scripts storage vendor .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: aadi-marketing-os-release-${{ github.sha }}
          path: dist/aadi-marketing-os-release.tar.gz
          retention-days: 30
